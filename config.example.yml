# OmniRoute-CLI configuration
# Copy this to config.yml and fill in your API keys.
# API key values support ${ENV_VAR} interpolation from the environment.

port: 20128

providers:
  # NVIDIA NIM — free tier, tried first (40 RPM, ~1000 monthly credits)
  # Get a free key at: https://build.nvidia.com → sign in → "Get API Key"
  # Free-tier models as of 2026-11-08 (catalog changes — verify at build.nvidia.com/models)
  - name: nvidia
    api_key: "${NVIDIA_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"
    models:
      # --- NVIDIA Nemotron family ---
      - nvidia/nemotron-3.5-bolt-e4b           # compact, fast, agentic
      - nvidia/nemotron-3.5-lightning-30b-a3b  # 30B MoE, fast
      - nvidia/nemotron-3.5-super-vl-120b-a12b # 120B vision+language
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - nvidia/nemotron-3-ultra-550b-a55b      # largest free NVIDIA model
      # --- Meta Llama ---
      - meta/llama-3.2-11b-vision-instruct
      - meta/llama-3.2-90b-vision-instruct
      - meta/muse-glimmer-30b
      # --- Google Gemma ---
      - google/gemma-4-31b-it
      - google/diffusiongemma-26b-a4b-it
      # --- DeepSeek ---
      - deepseek-ai/deepseek-v4.1-flash
      # --- Other free models ---
      - openai/gpt-oss-20b
      - minimaxai/minimax-m3.1-flash
      - stepfun-ai/step-5-preview
      - poolside/laguna-xs-2.1
      - z-ai/glm-5.3-flash
    priority: 1   # first choice — free

  - name: openai
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-3.5-turbo
    priority: 2   # fallback when NVIDIA hits rate limit or lacks the model

  - name: anthropic
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com/v1"
    models:
      - claude-sonnet-4-5
      - claude-haiku-4-5
    priority: 3   # final fallback

  # Example: a local Ollama instance (free, no key needed)
  # - name: ollama
  #   api_key: "ollama"
  #   base_url: "http://localhost:11434/v1"
  #   models:
  #     - llama3.2
  #     - mistral
  #   priority: 4

routing:
  strategy: priority   # priority | round-robin | random
  fallback: true       # on provider error, try the next one automatically

# Task-aware routing: match keywords in the user message → prefer a specific model.
# The matched model's provider is promoted to the front of the try list.
# Falls back to normal priority order if that provider is unavailable.
task_routing:
  coding:
    keywords:
      - function
      - class
      - bug
      - debug
      - refactor
      - python
      - javascript
      - typescript
      - react
      - sql
      - api
      - code
      - implement
      - script
      - error
      - exception
    preferred_model: deepseek-ai/deepseek-v4.1-flash   # strong coder, free on NVIDIA

  analysis:
    keywords:
      - stock
      - ticker
      - price
      - chart
      - trend
      - portfolio
      - market
      - trading
      - forecast
      - indicator
      - RSI
      - MACD
      - moving average
      - backtest
      - candlestick
      - volume
      - earnings
    preferred_model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning   # reasoning model for analysis

# Model name remapping — translates the model name the client sends to a real provider model.
# Supports exact match or prefix match (first prefix that fits wins).
# Essential for Claude Code, which sends claude-* model names.
model_map:
  claude-opus:   nvidia/nemotron-3-ultra-550b-a55b        # biggest free NVIDIA model
  claude-sonnet: nvidia/nemotron-3.5-lightning-30b-a3b    # fast 30B MoE
  claude-haiku:  nvidia/nemotron-3.5-bolt-e4b             # compact, lowest latency
  claude:        nvidia/nemotron-3.5-lightning-30b-a3b    # catch-all for any other claude-*

auth:
  enabled: false       # set to true to require a bearer token
  # api_key: "change-me"
